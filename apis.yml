aid: paxos
name: Paxos
description: >-
  Paxos is a regulated blockchain and stablecoin infrastructure company that lets enterprises move
  any asset, any time, through a single API. The Paxos v2 REST/FIX/WebSocket platform covers
  stablecoin issuance and 1:1 conversion (USDG, PYUSD, USDP, PAXG), crypto brokerage and order-book
  trading, held-rate quotes, custody, fiat and crypto transfers, identity/KYC and account onboarding,
  orchestration workflows, rewards, tax forms, and Travel Rule compliance. Authentication is OAuth 2.0
  client credentials, errors are RFC 9457 problem+json, and a full sandbox with test tooling is
  provided. Paxos issues PayPal USD (PYUSD) and the Global Dollar (USDG).
