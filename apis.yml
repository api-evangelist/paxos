- aid: paxos:paxos-quotes-api
  name: Paxos Quotes API
  description: >-
    Quotes are "held rates" offered by Paxos to buy or sell assets at a specific

    price within a period of time - for example, the option to buy BTC within

    the next 30 seconds for $8,000.


    The typical Quotes workflow is as follows:


    1. Call [List Quotes](#operation/ListQuotes) to get the latest available
       quoted prices for the assets you want to buy or sell.
    1. Present the offered price to one or more end-users, with a timer
       indicating the time to expiration.
    1. If a user accepts the price, call [Create Quote Execution](#operation/CreateQuoteExecution) with
    the amount to buy or sell.

    1. Call [Get Quote Execution](#operation/GetQuoteExecution) to monitor
       for completion and know when the funds from the execution are available.

    It's important to show end-users the latest available price. If you cache

    prices to show them to multiple users, you should refresh the cache once

    per second.


    You can call [List Quote Executions](#operation/ListQuoteExecutions) to

    review or construct reports on quote execution activity.
  humanURL: https://docs.paxos.com/api-reference/introduction
  baseURL: https://api.paxos.com/v2
  tags:
  - Quotes
  properties:
  - type: OpenAPI
    url: openapi/paxos-quotes-api-openapi.yml
  - type: LLMsTxt
    url: llms/paxos-llms.txt
- aid: paxos:paxos-reward-addresses-api
  name: Paxos Reward Addresses API
  description: >-
    Reward addresses are blockchain addresses registered for reward attribution.


    Custody Rewards: For EVM chains, Paxos registers these addresses on-chain for reward calculation and
    accrual in the token contract. For Solana, provide the **owner account** (not a token account) — Paxos
    will derive and register the associated token account on-chain for the given asset. Providing a token
    account will result in a derived address with no meaning. For other non-EVM chains, Paxos tracks on-chain
    activity for custody reward calculation.


    Non-Custody Rewards: Paxos tracks on-chain activity for these addresses to calculate and distribute
    non-custody rewards to your organization.


