                      price: '9237.50'
                      amount: '1.68421231'
                      executed_at: '2020-01-17T18:36:52.737Z'
      parameters:
      - name: market
        description: Market of the executions.
        in: path
        required: true
        schema:
          type: string
          enum:
          - ETHEUR
          - ETHSGD
          - ETHUSD
          - BTCEUR
          - BTCSGD
          - BTCUSD
          - PAXGUSD
          - BCHUSD
          - LTCUSD
          - USDPUSD
          - ETHBRL
