      description: StaleFeeQuote represents a transfer cancelled because on-chain state changed after the fee was quoted.
    TransferType:
      type: string
      enum:
      - INTERNAL_TRANSFER_DEBIT
      - INTERNAL_TRANSFER_CREDIT
      - CRYPTO_DEPOSIT
      - CRYPTO_WITHDRAWAL
      - WIRE_DEPOSIT
      - WIRE_WITHDRAWAL
      - SEN_DEPOSIT
      - SEN_WITHDRAWAL
      - BANK_DEPOSIT
      - BANK_WITHDRAWAL
      - PAXOS_TRANSFER_DEBIT
      - PAXOS_TRANSFER_CREDIT
      - SIGNET_DEPOSIT
      - SIGNET_WITHDRAWAL
      - CBIT_WITHDRAWAL
      - CBIT_DEPOSIT
      - CUBIX_DEPOSIT
      - CUBIX_WITHDRAWAL
      - RTP_DEPOSIT
      description: Type of transfer.
    MailingAddress:
      type: object
      properties:
        country:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
        address1:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
        address2:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
        city:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
        province:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
        zip_code:
          type: string
          maxLength: 35
          pattern: ^[0-9A-Za-z /?:().,&'+-]+$
      description: A mailing address.
      required:
      - country
    FiatNetwork:
      type: string
      enum:
      - WIRE
      - DBS_ACT
      - CUBIX
      - SCB
      - RTP
    CreateFiatWithdrawalRequest:
      type: object
      example:
        amount: '12.34'
        asset: USD
        fiat_account_id: caa82b32-8abd-4899-afdc-f9d4bf9b4e98
        profile_id: 5fc6d191-193c-4e28-94fa-656bbdbdfaad
        identity_id: 54385e67-d7ef-40d1-b488-ceda6dd9b264
      properties:
        ref_id:
          type: string
          description: The optional client-specified ID (for idempotence).
        amount:
          type: string
          description: Amount to withdraw, excluding fees. Specify exactly one of `amount` or `total`. When `amount` is specified, Paxos initiates the withdrawal for `amount` and then charges fees.
          pattern: ^[0-9]*\.?[0-9]{1,2}$
        asset:
          type: string
          description: 'The asset to withdraw. Current supported asset: "USD".'
        fiat_account_id:
          type: string
          description: The fiat account (`fiat_account_id`) destination.
        profile_id:
          type: string
          description: The Profile (`profile_id`) to withdraw from.
        identity_id:
          type: string
          description: 'The Identity (`identity_id`) of the user making the withdrawal.

            Required only for customers with [3rd-Party integrations](https://docs.paxos.com/crypto-brokerage/ledger-type#fiat-and-crypto-subledger) initiating transfers on behalf of their end users.'
        account_id:
          type: string
          description: 'The Account (`account_id`) associated with the Identity of the user making the withdrawal.

            Required only for customers with [3rd-Party integrations](https://docs.paxos.com/crypto-brokerage/ledger-type#fiat-and-crypto-subledger) initiating transfers on behalf of their end users.'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Optional client-specified metadata.

            Up to 6 key/value pairs may be provided.

            Each key and value must be less than or equal to 100 characters.'
        memo:
          type: string
          description: 'Optional additional memo to be set on the outgoing withdrawal.

            For wire withdrawals the character limit is 100.

            For CUBIX intrabank withdrawals, the character limit is 40.

            For DBS intrabank withdrawals, the character limit is 100.

            For SCB intrabank withdrawals, the character limit is 140.'
          maxLength: 500
          pattern: ^[0-9A-Za-z /?:().,&'+-]*$
        total:
          type: string
          format: decimal
          description: Total to withdraw, including fees. Specify exactly one of `amount` or `total`. When `total` is specified, Paxos initiates the withdrawal for `total` minus the fee.
      required:
      - asset
      - fiat_account_id
      - profile_id
    PendingCustomerApproval:
      type: object
      properties:
        message:
          type: string
          title: Human-readable explanation
      description: PendingCustomerApproval represents that this resource is awaiting customer approval.
    TransferStatus:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - FAILED
    TransferPublicUpdateFiatAccountBody:
